name: CI Backend — Constructora Eder Torres

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verificacion-backend:
    name: Compilación, API E2E y recuperación PostgreSQL
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK fijado en global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Localizar PostgreSQL para las pruebas aisladas
        shell: pwsh
        run: |
          $candidatos = @($env:PG_BIN) + @(Get-ChildItem -LiteralPath 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName 'bin' })
          $binarios = $candidatos | Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ 'initdb.exe')) } | Select-Object -First 1
          if (-not $binarios) { throw 'No se localizaron binarios de PostgreSQL en el agente de CI.' }
          "PG_BIN=$binarios" >> $env:GITHUB_ENV

      - name: Restaurar versiones bloqueadas
        run: dotnet restore ConstructoraEderTorres.sln --locked-mode

      - name: Comprobar avisos de vulnerabilidad de dependencias
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet list ConstructoraEderTorres.sln package --vulnerable --include-transitive --format json --output-version 1 > artifacts/DependenciasApiIntegracion.json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo comprobar el informe de dependencias.' }
          $informe = Get-Content -LiteralPath artifacts/DependenciasApiIntegracion.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($proyecto in $informe.projects) {
            foreach ($marco in $proyecto.frameworks) {
              if ($marco.topLevelPackages.Count -gt 0 -or $marco.transitivePackages.Count -gt 0) {
                throw 'Se detectaron dependencias con avisos de vulnerabilidad. Revise el artefacto del informe.'
              }
            }
          }

      - name: Compilar Release con advertencias como errores
        run: dotnet build ConstructoraEderTorres.sln --no-restore --configuration Release

      - name: Ejecutar pruebas E2E, concurrencia, seguridad y persistencia
        run: dotnet test ConstructoraEderTorres.sln --no-build --no-restore --configuration Release --logger "trx;LogFileName=backend.trx" --results-directory artifacts/ResultadosPruebas --verbosity minimal

      - name: Verificar inspección y recuperación real de respaldo
        shell: pwsh
        run: '& ./Tests/Integracion/VerificarPersistenciaPostgreSql.ps1 -BinariosPostgreSql $env:PG_BIN -Configuracion Release'

      - name: Preparar entrega de API, respaldo y operación con manifiesto de hashes
        shell: pwsh
        run: '& ./Tools/Operacion/PrepararEntrega.ps1 -Configuracion Release'

      - name: Conservar entrega verificada
        uses: actions/upload-artifact@v4
        with:
          name: entrega-backend
          path: artifacts/Entregas/*.zip
          if-no-files-found: error

      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend
          path: |
            artifacts/ResultadosPruebas/*.trx
            artifacts/ContratosApi/openapi.v1.json
            artifacts/DependenciasApiIntegracion.json
          if-no-files-found: warn
